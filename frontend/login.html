<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - AI-Based Tree Plantation System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#f3ece1;--mute:#c8bba8;--dark:#1c1814;--field:#241e18;--line:#5a4d3d;--btn:#16845f;--bad:#f2a28d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--dark);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
.left{position:relative;overflow:hidden;background:linear-gradient(160deg,#0d4d38,#16845f);padding:32px;display:flex;flex-direction:column;justify-content:space-between}
.left h2{font-size:clamp(22px,2.6vw,28px);line-height:1.2;margin:0 0 12px}
.left ul{margin:0;padding-left:18px;color:#d3f0e1}
.left svg{position:absolute;left:0;right:0;top:10%;width:100%;height:55%;opacity:.95}
.left .txt{position:relative}
.right{display:flex;align-items:center;justify-content:center;padding:32px}
form{width:100%;max-width:380px}
h1{margin:0 0 4px;font-size:24px}
.sub{color:var(--mute);margin:0 0 20px}
label{display:block;font-size:13px;color:var(--mute);margin-top:12px}
input{width:100%;margin-top:4px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit}
button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:10px;font:inherit;cursor:pointer;background:var(--btn);color:#fff}
button.google{background:transparent;border:1px solid var(--line);color:var(--ink);margin-top:0}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #5be37d;outline-offset:2px}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);margin:18px 0;font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.switch{text-align:center;margin-top:18px;color:var(--mute)}
.switch a{color:#5be37d;cursor:pointer}
#msg{min-height:1.4em;margin:12px 0 0;font-size:14px}
#msg.err{color:var(--bad)}#msg.ok{color:#8fe3a8}
@media(max-width:800px){body{grid-template-columns:1fr}.left{display:none}}
</style>
</head>
<body>

<aside class="left">
  <strong>Tree Plantation AI</strong>
  <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <circle cx="300" cy="40" r="34" fill="#5fb85a" opacity=".85"/>
    <path d="M0 210 Q120 170 230 205 T400 190 V260 H0Z" fill="#0b5a42" opacity=".6"/>
    <rect x="182" y="150" width="16" height="80" fill="#6b4a32"/>
    <circle cx="150" cy="130" r="42" fill="#1f9e6e"/>
    <circle cx="232" cy="130" r="42" fill="#1f9e6e"/>
    <circle cx="190" cy="95" r="52" fill="#2bb581"/>
    <circle cx="190" cy="95" r="24" fill="#6fe08a"/>
  </svg>
  <div class="txt">
    <h2>Climate-resilient tree<br>recommendations for Thatta</h2>
    <ul>
      <li>Grounded in retrieved evidence, not guesses</li>
      <li>Every answer shows its document and page</li>
    </ul>
  </div>
</aside>

<main class="right">
  <form id="form" novalidate>
    <h1 id="title">Sign in</h1>
    <p class="sub" id="sub">Welcome back. Sign in to continue.</p>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required minlength="6">

    <button id="submit" type="submit">Sign in</button>
    <div class="or">or</div>
    <button id="google" class="google" type="button">Continue with Google</button>

    <p id="msg" role="alert"></p>
    <p class="switch"><span id="switchText">New here?</span> <a id="switchLink" tabindex="0" role="button">Create an account</a></p>
  </form>
</main>

<script>
const SUPABASE_URL = "https://ajasfbphhqhbibsybeyr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqYXNmYnBoaHFoYmlic3liZXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NjUwNDQsImV4cCI6MjExMDM0MTA0NH0.DhkVu9kyL_SOjPsvNlPFhTuqOCwxtuHGPoSw9pHHh20";
// Where to go after a successful sign-in. It must be a page that loads supabase-js (not a redirect page),
// because Google sign-in returns the session in the address and the page has to pick it up.
const NEXT_PAGE = "home.html";

const $ = s => document.querySelector(s);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let mode = "signin";

function say(text, kind) { const m = $("#msg"); m.textContent = text; m.className = kind || ""; }
function goNext() { location.href = new URL(NEXT_PAGE, location.href).href; }

function setMode(next) {
  mode = next;
  const up = mode === "signup";
  $("#title").textContent = up ? "Create an account" : "Sign in";
  $("#sub").textContent = up ? "Use your email to create an account." : "Welcome back. Sign in to continue.";
  $("#submit").textContent = up ? "Create account" : "Sign in";
  $("#password").autocomplete = up ? "new-password" : "current-password";
  $("#switchText").textContent = up ? "Already have an account?" : "New here?";
  $("#switchLink").textContent = up ? "Sign in" : "Create an account";
  say("");
}
$("#switchLink").onclick = () => setMode(mode === "signin" ? "signup" : "signin");
$("#switchLink").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#switchLink").click(); } };

$("#form").onsubmit = async e => {
  e.preventDefault();
  const email = $("#email").value.trim(), password = $("#password").value;
  if (!email || password.length < 6) return say("Enter your email and a password of at least 6 characters.", "err");

  $("#submit").disabled = true; say("");
  try {
    if (mode === "signin") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      goNext();
    } else {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (data.session) goNext();
      else say("Account created. Check your email and click the confirmation link, then sign in.", "ok");
    }
  } catch (err) {
    say(err.message, "err");
  }
  $("#submit").disabled = false;
};

$("#google").onclick = async () => {
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: new URL(NEXT_PAGE, location.href).href }
  });
  if (error) say(error.message, "err");
};

// Already signed in? Skip this page.
(async () => {
  if (SUPABASE_URL.startsWith("PASTE")) return say("Set SUPABASE_URL and SUPABASE_ANON_KEY in this file first.", "err");
  const { data } = await sb.auth.getSession();
  if (data.session) goNext();
})();
</script>
</body>
</html>
